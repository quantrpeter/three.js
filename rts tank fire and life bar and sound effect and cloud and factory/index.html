		function createStarfield() {
			const starCount = 5000;
			const positions = new Float32Array(starCount * 3);
			const sizes = new Float32Array(starCount);
			for (let i = 0; i < starCount; i++) {
				const theta = Math.random() * Math.PI * 2;
				const phi = Math.acos(2 * Math.random() - 1);
				const r = 80 + Math.random() * 120;
				positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
				positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
				positions[i * 3 + 2] = r * Math.cos(phi);
				sizes[i] = 0.5 + Math.random() * 1.5;
			}
			const geo = new THREE.BufferGeometry();
			geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
			geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
			const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, sizeAttenuation: true });
			scene.add(new THREE.Points(geo, mat));
		}

		function valueNoise3D(x, y, z) {
			const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
			const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
			const xf = x - xi, yf = y - yi, zf = z - zi;
			const u = fade(xf), v = fade(yf), w = fade(zf);
			const h = (a, b, c) => {
				const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453;
				return (s - Math.floor(s)) * 2 - 1;
			};
			const n000 = h(xi, yi, zi);
			const n100 = h(xi + 1, yi, zi);
			const n010 = h(xi, yi + 1, zi);
			const n110 = h(xi + 1, yi + 1, zi);
			const n001 = h(xi, yi, zi + 1);
			const n101 = h(xi + 1, yi, zi + 1);
			const n011 = h(xi, yi + 1, zi + 1);
			const n111 = h(xi + 1, yi + 1, zi + 1);
			const x00 = n000 + u * (n100 - n000);
			const x10 = n010 + u * (n110 - n010);
			const x01 = n001 + u * (n101 - n001);
			const x11 = n011 + u * (n111 - n011);
			const y0 = x00 + v * (x10 - x00);
			const y1 = x01 + v * (x11 - x01);
			return y0 + w * (y1 - y0);
		}

		function fbm3D(x, y, z, octaves) {
			let total = 0, amp = 1, freq = 1, max = 0;
			for (let i = 0; i < octaves; i++) {
				total += amp * valueNoise3D(x * freq, y * freq, z * freq);
				max += amp;
				amp *= 0.5;
				freq *= 2.0;
			}
			return total / max;
		}

		function terrainElevation(nx, ny, nz) {
			const continent = fbm3D(nx * 1.3, ny * 1.3, nz * 1.3, 4);
			const detail = fbm3D(nx * 4.5, ny * 4.5, nz * 4.5, 5) * 0.35;
			const ridges = (1.0 - Math.abs(fbm3D(nx * 3.0, ny * 3.0, nz * 3.0, 3))) * 0.4;
			return { continent, raw: continent + detail, ridges };
		}

		function displacementFor(elev) {
			const MAX_LAND_HEIGHT = 0.18;
			const OCEAN_FLOOR_DEPTH = 0.04;
			if (elev.raw > 0) {
				const land01 = Math.min(1, elev.raw);
				const shaped = Math.pow(land01, 1.1);
				const peak = elev.ridges * Math.max(0, land01 - 0.15);
				return 0.003 + (shaped * 0.7 + peak * 0.55) * MAX_LAND_HEIGHT;
			}
			const depth = Math.min(1, -elev.raw);
			return -depth * OCEAN_FLOOR_DEPTH;
		}

		function createPlanet() {
			const MAX_LAND_HEIGHT = 0.18;
			const OCEAN_RADIUS_OFFSET = 0.002;

			const geo = new THREE.SphereGeometry(planetRadius, 192, 192);
			const positions = geo.attributes.position;
			const vCount = positions.count;
			const colors = new Float32Array(vCount * 3);

			for (let i = 0; i < vCount; i++) {
				const x = positions.getX(i);
				const y = positions.getY(i);
				const z = positions.getZ(i);
				const len = Math.sqrt(x * x + y * y + z * z) || 1;
				const nx = x / len, ny = y / len, nz = z / len;

				const elev = terrainElevation(nx, ny, nz);
				const disp = displacementFor(elev);
				const newR = planetRadius + disp;
				positions.setXYZ(i, nx * newR, ny * newR, nz * newR);

				const tint = valueNoise3D(nx * 18, ny * 18, nz * 18) * 0.04;
				let r, g, b;

				if (elev.raw <= 0) {
					const d = Math.min(1, -elev.raw);
					r = 0.03 + (1 - d) * 0.05;
					g = 0.10 + (1 - d) * 0.12;
					b = 0.22 + (1 - d) * 0.18;
				} else {
					const h = disp / MAX_LAND_HEIGHT;
					if (h < 0.025) {
						r = 0.82; g = 0.74; b = 0.52;
					} else if (h < 0.12) {
						const t = (h - 0.025) / 0.095;
						r = 0.30 - t * 0.10;
						g = 0.52 - t * 0.10;
						b = 0.18 - t * 0.05;
					} else if (h < 0.4) {
						const t = (h - 0.12) / 0.28;
						r = 0.22 + t * 0.05;
						g = 0.40 - t * 0.10;
						b = 0.14 + t * 0.02;
					} else if (h < 0.7) {
						const t = (h - 0.4) / 0.3;
						r = 0.38 + t * 0.15;
						g = 0.34 + t * 0.12;
						b = 0.30 + t * 0.08;
					} else {
						const t = Math.min(1, (h - 0.7) / 0.3);
						r = 0.62 + t * 0.34;
						g = 0.65 + t * 0.32;
						b = 0.70 + t * 0.28;
					}

					r += tint; g += tint * 0.8; b += tint * 0.6;
				}

				colors[i * 3] = Math.max(0, Math.min(1, r));
				colors[i * 3 + 1] = Math.max(0, Math.min(1, g));
				colors[i * 3 + 2] = Math.max(0, Math.min(1, b));
			}

			geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
			geo.computeVertexNormals();

			const mat = new THREE.MeshStandardMaterial({
				vertexColors: true,
				roughness: 0.92,
				metalness: 0.0,
				flatShading: false,
			});

			planet = new THREE.Mesh(geo, mat);
			planet.castShadow = true;
			planet.receiveShadow = true;
			scene.add(planet);

			const oceanGeo = new THREE.SphereGeometry(planetRadius + OCEAN_RADIUS_OFFSET, 128, 128);
			const oceanMat = new THREE.MeshStandardMaterial({
				color: 0x1242bb,
				roughness: 0.25,
				metalness: 0.55,
				transparent: true,
				opacity: 0.92,
				emissive: 0x0a1f3a,
				emissiveIntensity: 0.15,
			});
			const ocean = new THREE.Mesh(oceanGeo, oceanMat);
			ocean.receiveShadow = true;
			ocean.renderOrder = 1;
			scene.add(ocean);

			// const atmosGeo = new THREE.SphereGeometry(planetRadius * 1.07, 64, 64);
			// const atmosMat = new THREE.ShaderMaterial({
			// 	transparent: true,
			// 	side: THREE.BackSide,
			// 	depthWrite: false,
			// 	blending: THREE.AdditiveBlending,
			// 	uniforms: { glowColor: { value: new THREE.Color(0x6ab0ff) } },
			// 	vertexShader: `
			// 		varying vec3 vN;
			// 		varying vec3 vV;
			// 		void main() {
			// 			vN = normalize(normalMatrix * normal);
			// 			vec4 mv = modelViewMatrix * vec4(position, 1.0);
			// 			vV = normalize(-mv.xyz);
			// 			gl_Position = projectionMatrix * mv;
			// 		}
			// 	`,
			// 	fragmentShader: `
			// 		uniform vec3 glowColor;
			// 		varying vec3 vN;
			// 		varying vec3 vV;
			// 		void main() {
			// 			float rim = pow(1.0 - max(dot(vN, vV), 0.0), 2.5);
			// 			gl_FragColor = vec4(glowColor * rim, rim);
			// 		}
			// 	`,
			// });
			// scene.add(new THREE.Mesh(atmosGeo, atmosMat));
		}

		function getTerrainRadius(dir) {
			if (!planet) return planetRadius;
			raycaster.set(
				dir.clone().multiplyScalar(planetRadius * 2.5),
				dir.clone().negate()
			);
			const hits = raycaster.intersectObject(planet);
			return hits.length > 0 ? hits[0].point.length() : planetRadius;
		}

		function createCloudPuffTexture(seed) {
			const size = 256;
			const canvas = document.createElement('canvas');
			canvas.width = canvas.height = size;
			const ctx = canvas.getContext('2d');

			let s = seed * 9301 + 49297;
			const rand = () => {
				s = (s * 9301 + 49297) % 233280;
				return s / 233280;
			};

			const blobCount = 9 + Math.floor(rand() * 6);
			for (let i = 0; i < blobCount; i++) {
				const cx = size * (0.18 + rand() * 0.64);
				const cy = size * (0.35 + rand() * 0.3);
				const r = size * (0.09 + rand() * 0.14);
				const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
				g.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
				g.addColorStop(0.45, 'rgba(252, 254, 255, 0.45)');
				g.addColorStop(1, 'rgba(240, 248, 255, 0)');
				ctx.fillStyle = g;
				ctx.fillRect(0, 0, size, size);
			}

			const img = ctx.getImageData(0, 0, size, size);
			for (let i = 0; i < img.data.length; i += 4) {
				const a = img.data[i + 3];
				if (a > 0) {
					const n = (rand() - 0.5) * 40;
					img.data[i + 3] = Math.max(0, Math.min(255, a + n));
				}
			}
			ctx.putImageData(img, 0, 0);

			const tex = new THREE.CanvasTexture(canvas);
			tex.colorSpace = THREE.SRGBColorSpace;
			tex.anisotropy = 4;
			return tex;
		}

		function createClouds() {
			const textures = [];
			for (let i = 0; i < 8; i++) textures.push(createCloudPuffTexture(i + 1));

			const cloudCount = 55;
			for (let i = 0; i < cloudCount; i++) {
				const tex = textures[Math.floor(Math.random() * textures.length)];
				const w = 0.55 + Math.random() * 1.0;
				const h = w * (0.42 + Math.random() * 0.28);

				const tint = 0.94 + Math.random() * 0.06;
				const mat = new THREE.MeshBasicMaterial({
					map: tex,
					transparent: true,
					opacity: 0.55 + Math.random() * 0.3,
					depthWrite: false,
					side: THREE.FrontSide,
					toneMapped: false,
					color: new THREE.Color(tint, tint, 1.0),
				});
				const cloud = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
				cloud.renderOrder = 5;

				const axis = new THREE.Vector3(
					Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
				).normalize();
				const altitude = planetRadius + 0.28 + Math.random() * 0.22;

				cloud.userData = {
					axis: axis,
					altitude: altitude,
					driftAxis: new THREE.Vector3(
						Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
					).normalize(),
					driftSpeed: 0.008 + Math.random() * 0.018,
					spin: Math.random() * Math.PI * 2,
					spinSpeed: (Math.random() - 0.5) * 0.05,
				};

				positionCloud(cloud);
				scene.add(cloud);
				clouds.push(cloud);
			}
		}

		function positionCloud(cloud) {
			const ud = cloud.userData;
			const up = ud.axis;
			cloud.position.copy(up).multiplyScalar(ud.altitude);
			const baseQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), up);
			const spinQ = new THREE.Quaternion().setFromAxisAngle(up, ud.spin);
			cloud.quaternion.multiplyQuaternions(spinQ, baseQ);
		}

		function updateClouds(delta) {
			const driftQ = new THREE.Quaternion();
			for (const cloud of clouds) {
				const ud = cloud.userData;
				driftQ.setFromAxisAngle(ud.driftAxis, ud.driftSpeed * delta);
				ud.axis.applyQuaternion(driftQ).normalize();
				ud.spin += ud.spinSpeed * delta;
				positionCloud(cloud);
			}
		}

		function drawUnitIcon(type) {
			const size = 64;
			const canvas = document.createElement('canvas');
			canvas.width = size;
			canvas.height = size;
			const ctx = canvas.getContext('2d');

			ctx.fillStyle = 'rgba(0, 20, 50, 0.8)';
			ctx.beginPath();
			ctx.roundRect(0, 0, size, size, 6);
			ctx.fill();

			const info = unitTypes[type];
			const hexColor = '#' + info.color.toString(16).padStart(6, '0');
			const accentColor = '#' + info.accent.toString(16).padStart(6, '0');

			ctx.strokeStyle = accentColor;
			ctx.lineWidth = 2;
			ctx.lineJoin = 'round';
			ctx.lineCap = 'round';

			const cx = size / 2, cy = size / 2;

			if (type === 'ship') {
				ctx.fillStyle = hexColor;
				ctx.beginPath();
				ctx.moveTo(cx + 18, cy);
				ctx.lineTo(cx - 12, cy - 14);
				ctx.lineTo(cx - 8, cy);
				ctx.lineTo(cx - 12, cy + 14);
				ctx.closePath();
				ctx.fill();
				ctx.stroke();

				ctx.beginPath();
				ctx.moveTo(cx - 10, cy - 10);
				ctx.lineTo(cx - 18, cy - 18);
				ctx.lineTo(cx - 14, cy - 8);
				ctx.stroke();
				ctx.beginPath();
				ctx.moveTo(cx - 10, cy + 10);
				ctx.lineTo(cx - 18, cy + 18);
				ctx.lineTo(cx - 14, cy + 8);
				ctx.stroke();
			} else if (info.isTank) {
				const s = info.tankScale || 1.0;
				const bw = Math.round(32 * s);
				const bh = Math.round(16 * s);
				const tw = Math.round(36 * s);
				const tr = Math.round(6 * s);
				const barLen = Math.round(20 * s);

				ctx.fillStyle = hexColor;
				ctx.fillRect(cx - bw / 2, cy - 6, bw, bh);
				ctx.strokeRect(cx - bw / 2, cy - 6, bw, bh);

				ctx.fillRect(cx - tw / 2, cy - 10, tw, 4);
				ctx.strokeRect(cx - tw / 2, cy - 10, tw, 4);
				ctx.fillRect(cx - tw / 2, cy + 10, tw, 4);
				ctx.strokeRect(cx - tw / 2, cy + 10, tw, 4);

				ctx.beginPath();
				ctx.arc(cx - 4, cy + 2, tr, 0, Math.PI * 2);
				ctx.fill();
				ctx.stroke();

				ctx.lineWidth = Math.max(2, Math.round(3 * s));
				ctx.beginPath();
				ctx.moveTo(cx, cy + 2);
				ctx.lineTo(cx + barLen, cy - 4);
				ctx.stroke();
				ctx.lineWidth = 2;
			} else if (type === 'tankFactory') {
				ctx.fillStyle = hexColor;
				ctx.fillRect(cx - 18, cy - 4, 32, 22);
				ctx.strokeRect(cx - 18, cy - 4, 32, 22);

				ctx.fillStyle = accentColor;
				ctx.fillRect(cx - 20, cy - 8, 36, 5);
				ctx.strokeRect(cx - 20, cy - 8, 36, 5);

				ctx.fillStyle = hexColor;
				ctx.fillRect(cx - 10, cy - 22, 7, 14);
				ctx.strokeRect(cx - 10, cy - 22, 7, 14);
				ctx.fillStyle = accentColor;
				ctx.fillRect(cx - 11, cy - 24, 9, 3);

				ctx.fillStyle = 'rgba(220, 220, 230, 0.85)';
				ctx.beginPath();
				ctx.arc(cx - 4, cy - 26, 3.5, 0, Math.PI * 2);
				ctx.fill();
				ctx.beginPath();
				ctx.arc(cx + 1, cy - 30, 4.5, 0, Math.PI * 2);
				ctx.fill();
				ctx.beginPath();
				ctx.arc(cx + 7, cy - 27, 3, 0, Math.PI * 2);
				ctx.fill();

				ctx.fillStyle = '#ffd070';
				for (let i = 0; i < 3; i++) {
					ctx.fillRect(cx - 14 + i * 9, cy + 3, 4, 5);
				}

				ctx.fillStyle = '#222';
				ctx.fillRect(cx + 14, cy + 4, 4, 14);
				ctx.strokeRect(cx + 14, cy + 4, 4, 14);
			} else if (type === 'robot') {
				ctx.fillStyle = hexColor;
				ctx.fillRect(cx - 8, cy - 4, 16, 18);
				ctx.strokeRect(cx - 8, cy - 4, 16, 18);

				ctx.fillRect(cx - 6, cy - 12, 12, 10);
				ctx.strokeRect(cx - 6, cy - 12, 12, 10);

				ctx.fillStyle = '#ff3333';
				ctx.fillRect(cx - 4, cy - 9, 8, 3);

				ctx.fillStyle = hexColor;
				for (const s of [-1, 1]) {
					ctx.fillRect(cx + s * 4 - 3, cy + 14, 6, 10);
					ctx.strokeRect(cx + s * 4 - 3, cy + 14, 6, 10);

					ctx.fillRect(cx + s * 12 - 3, cy - 2, 6, 14);
					ctx.strokeRect(cx + s * 12 - 3, cy - 2, 6, 14);
				}
			}

			return canvas;
		}

		function buildMenu() {
			const menu = document.getElementById('menu');
			menu.innerHTML = '';

			for (const type of Object.keys(unitTypes)) {
				if (unitTypes[type].placeable === false) continue;
				const item = document.createElement('div');
				item.className = 'menu-item';
				item.dataset.unit = type;

				const icon = drawUnitIcon(type);
				item.appendChild(icon);

				const label = document.createElement('div');
				label.className = 'label';
				label.textContent = unitTypes[type].label;
				item.appendChild(label);

				item.addEventListener('click', () => {
					document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('selected'));

					if (selectedUnit === type) {
						selectedUnit = null;
						removeGhost();
					} else {
						selectedUnit = type;
						item.classList.add('selected');
						deselectPlacedUnit();
					}
					updateHint();
				});

				menu.appendChild(item);
			}
		}

		function removeGhost() {
			if (ghostMesh) {
				scene.remove(ghostMesh);
				ghostMesh = null;
			}
		}

		function updateGhost(point, normal) {
			if (!selectedUnit) { removeGhost(); return; }

			if (!ghostMesh || ghostMesh.userData.unitType !== selectedUnit) {
				removeGhost();
				ghostMesh = createUnitMesh(selectedUnit);
				ghostMesh.traverse(child => {
					if (child.isMesh) {
						child.material = child.material.clone();
						child.material.transparent = true;
						child.material.opacity = 0.5;
						child.material.userData.origColor = child.material.color.getHex();
						child.material.userData.origEmissive = child.material.emissive.getHex();
					}
				});
				scene.add(ghostMesh);
			}

			orientToSurface(ghostMesh, point, normal);

			isGhostValid = !wouldOverlap(point, null, getUnitRadius(selectedUnit));
			ghostMesh.traverse(child => {
				if (child.isMesh) {
					if (isGhostValid) {
						child.material.color.setHex(child.material.userData.origColor);
						child.material.emissive.setHex(child.material.userData.origEmissive);
					} else {
						child.material.color.set(0xff2222);
						child.material.emissive.set(0x440000);
					}
				}
			});
		}

		function orientToSurface(obj, point, normal, facingDir) {
			obj.position.copy(point);
			const up = normal.clone().normalize();

			const baseQuat = new THREE.Quaternion();
			baseQuat.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);

			if (facingDir) {
				const tangent = facingDir.clone().sub(up.clone().multiplyScalar(facingDir.dot(up)));
				if (tangent.lengthSq() > 0.0001) {
					tangent.normalize();
					const localFwd = unitTypes[obj.userData.unitType].localForward.clone();
					const rotatedFwd = localFwd.applyQuaternion(baseQuat);
					const projFwd = rotatedFwd.clone().sub(up.clone().multiplyScalar(rotatedFwd.dot(up)));
					if (projFwd.lengthSq() > 0.0001) {
						projFwd.normalize();
						const angle = Math.atan2(
							new THREE.Vector3().crossVectors(projFwd, tangent).dot(up),
							projFwd.dot(tangent)
						);
						const extraRot = new THREE.Quaternion().setFromAxisAngle(up, angle);
						obj.quaternion.copy(extraRot.multiply(baseQuat));
						return;
					}
				}
			}

			obj.quaternion.copy(baseQuat);
		}

		function wouldOverlap(position, excludeUnit, ownRadius) {
			const r1 = ownRadius || UNIT_RADIUS;
			for (const unit of placedUnits) {
				if (unit === excludeUnit) continue;
				const r2 = getUnitRadius(unit);
				if (unit.position.distanceTo(position) < r1 + r2) return true;
			}
			return false;
		}

		function placeUnit(point, normal) {
			if (!selectedUnit) return;
			if (selectedUnit === 'ship' && !shipGeometry) return;
			if (wouldOverlap(point, null, getUnitRadius(selectedUnit))) return;

			const unit = createUnitMesh(selectedUnit);
			orientToSurface(unit, point, normal);
			scene.add(unit);
			placedUnits.push(unit);

			const maxHealth = unitTypes[selectedUnit].maxHealth || UNIT_MAX_HEALTH;
			unit.userData.health = maxHealth;
			unit.userData.maxHealth = maxHealth;
			createHealthBar(unit);

			document.getElementById('unit-count').textContent = `Units: ${placedUnits.length}`;
		}

		function selectPlacedUnit(unit) {
			deselectPlacedUnit();
			activeUnit = unit;
			selectionBox = new THREE.BoxHelper(unit, 0xffff00);
			selectionBox.rotation.copy(unit.rotation);
			scene.add(selectionBox);
			selectedUnit = null;
			removeGhost();
			document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('selected'));

			if (unit.userData.unitType === 'tankFactory') {
				showFactoryMenu(unit);
			}

			updateHint();
		}

		function deselectPlacedUnit() {
			if (selectionBox) {
				scene.remove(selectionBox);
				selectionBox = null;
			}
			activeUnit = null;
			hideFactoryMenu();
		}

		function showFactoryMenu(factory) {
			const menu = document.getElementById('unit-menu');

			menu.classList.add('visible');

			const title = document.createElement('div');
			title.className = 'panel-title';
			title.textContent = 'Tank Factory';
			menu.appendChild(title);

			const builds = unitTypes.tankFactory.factoryBuilds || [];
			for (const t of builds) {
				const info = unitTypes[t];
				const btn = document.createElement('div');
				btn.className = 'build-btn';

				const icon = drawUnitIcon(t);
				icon.style.width = '40px';
				icon.style.height = '40px';
				btn.appendChild(icon);

				const infoDiv = document.createElement('div');
				infoDiv.className = 'info';
				const name = document.createElement('div');
				name.className = 'name';
				name.textContent = info.buildLabel || info.label;
				infoDiv.appendChild(name);
				const stats = document.createElement('div');
				stats.className = 'stats';
				stats.textContent = `HP ${info.maxHealth}  \u2022  DMG ${info.bulletDamage}  \u2022  ${info.buildTime.toFixed(1)}s`;
				infoDiv.appendChild(stats);
				btn.appendChild(infoDiv);

				btn.addEventListener('click', () => enqueueFactoryBuild(factory, t));
				menu.appendChild(btn);
			}

			const queueWrap = document.createElement('div');
			queueWrap.className = 'queue';
			queueWrap.id = 'factory-queue';
			menu.appendChild(queueWrap);

			rebuildFactoryQueueUI();
		}

		function rebuildFactoryQueueUI() {
			const factory = activeUnit;
			if (!factory || factory.userData.unitType !== 'tankFactory') return;
			const queueEl = document.getElementById('factory-queue');
			if (!queueEl) return;

			queueEl.innerHTML = '';
			const title = document.createElement('div');
			title.className = 'queue-title';
			title.textContent = 'Build Queue';
			queueEl.appendChild(title);

			const queue = factory.userData.buildQueue || [];
			if (queue.length === 0) {
				const empty = document.createElement('div');
				empty.className = 'queue-empty';
				empty.textContent = 'Idle';
				queueEl.appendChild(empty);
				return;
			}

			queue.forEach((t, idx) => {
				const info = unitTypes[t];
				const row = document.createElement('div');
				row.className = 'queue-item';
				row.dataset.queueIdx = String(idx);

				const name = document.createElement('div');
				name.className = 'qname';
				name.textContent = info.label;
				row.appendChild(name);

				const bar = document.createElement('div');
				bar.className = 'progress-bar';
				const fill = document.createElement('div');
				fill.className = 'progress-fill';
				const pct = idx === 0
					? Math.min(1, (factory.userData.buildProgress || 0) / info.buildTime)
					: 0;
				fill.style.width = (pct * 100).toFixed(1) + '%';
				bar.appendChild(fill);
				row.appendChild(bar);

				const cancel = document.createElement('div');
				cancel.className = 'cancel';
				cancel.textContent = '\u2716';
				cancel.title = 'Cancel';
				cancel.addEventListener('click', (e) => {
					e.stopPropagation();
					cancelFactoryBuild(factory, idx);
				});
				row.appendChild(cancel);

				queueEl.appendChild(row);
			});
		}

		function updateFactoryProgressUI(factory) {
			const queueEl = document.getElementById('factory-queue');
			if (!queueEl) return;
			const firstRow = queueEl.querySelector('.queue-item[data-queue-idx="0"]');
			if (!firstRow) return;
			const fill = firstRow.querySelector('.progress-fill');
			if (!fill) return;
			const type = factory.userData.buildQueue[0];
			if (!type) return;
			const buildTime = unitTypes[type].buildTime || 5.0;
			const pct = Math.min(1, (factory.userData.buildProgress || 0) / buildTime);
			fill.style.width = (pct * 100).toFixed(1) + '%';
		}

		function hideFactoryMenu() {
			const menu = document.getElementById('unit-menu');
			menu.classList.remove('visible');
			menu.innerHTML = '';
		}

		function commandMoveTo(targetPoint) {
			if (!activeUnit) return;
			if (unitTypes[activeUnit.userData.unitType].speed === 0) return;
			playMoveSound();

			const startDir = activeUnit.position.clone().normalize();
			const targetDir = targetPoint.clone().normalize();
			const arcAngle = Math.acos(Math.max(-1, Math.min(1, startDir.dot(targetDir))));

			activeUnit.userData.moveStartDir = startDir;
			activeUnit.userData.moveTargetDir = targetDir;
			activeUnit.userData.moveTarget = targetDir.clone().multiplyScalar(getTerrainRadius(targetDir));
			activeUnit.userData.moveProgress = 0;
			activeUnit.userData.moveArcAngle = arcAngle;
		}

		function updateMovingUnits(delta) {
			for (const unit of placedUnits) {
				const ud = unit.userData;
				if (!ud.moveTarget || ud.moveProgress >= 1) continue;

				const speed = unitTypes[ud.unitType].speed;
				if (speed <= 0) {
					ud.moveTarget = null;
					continue;
				}
				const arcLength = ud.moveArcAngle * planetRadius;
				if (arcLength < 0.001) {
					ud.moveProgress = 1;
					ud.moveTarget = null;
					continue;
				}

				ud.moveProgress = Math.min(1, ud.moveProgress + (speed * delta) / arcLength);
				const t = ud.moveProgress;
				const angle = ud.moveArcAngle;
				const sinAngle = Math.sin(angle);

				let newDir;
				if (sinAngle < 0.001) {
					newDir = ud.moveTargetDir.clone();
				} else {
					newDir = ud.moveStartDir.clone()
						.multiplyScalar(Math.sin((1 - t) * angle) / sinAngle)
						.add(ud.moveTargetDir.clone().multiplyScalar(Math.sin(t * angle) / sinAngle));
				}
				newDir.normalize();

				const newPos = newDir.clone().multiplyScalar(getTerrainRadius(newDir));

				if (wouldOverlap(newPos, unit, getUnitRadius(unit))) {
					ud.moveProgress = 1;
					ud.moveTarget = null;
					continue;
				}

				const facingDir = ud.moveTarget.clone().sub(newPos);
				orientToSurface(unit, newPos, newDir, facingDir);

				if (ud.moveProgress >= 1) {
					ud.moveTarget = null;
				}
			}

			if (selectionBox) selectionBox.update();
		}

		function updateHint() {
			const hint = document.getElementById('placement-hint');
			if (selectedUnit) {
				hint.textContent = 'Click on the planet to place the unit';
			} else if (activeUnit) {
				const typeName = unitTypes[activeUnit.userData.unitType].label;
				hint.textContent = typeName + ' selected \u2014 click planet to move \u2022 Esc to deselect';
			} else {
				hint.textContent = 'Select a unit type below to place, or click a placed unit to command it';
			}
			hint.style.opacity = '0.7';
		}

		function onPointerMove(event) {
			mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
			mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

			if (wasClick) {
				const dx = event.clientX - pointerDownPos.x;
				const dy = event.clientY - pointerDownPos.y;
				if (dx * dx + dy * dy > 9) wasClick = false;
			}

			if (selectedUnit) {
				raycaster.setFromCamera(mouse, camera);
				const intersects = raycaster.intersectObject(planet);
				if (intersects.length > 0) {
					const hit = intersects[0];
					updateGhost(hit.point, hit.face.normal.clone().transformDirection(planet.matrixWorld));
					document.body.style.cursor = 'crosshair';
				} else {
					removeGhost();
					document.body.style.cursor = 'default';
				}
				return;
			}

			raycaster.setFromCamera(mouse, camera);
			const unitMeshes = [];
			for (const unit of placedUnits) {
				unit.traverse(child => { if (child.isMesh) unitMeshes.push(child); });
			}
			if (raycaster.intersectObjects(unitMeshes, false).length > 0) {
				document.body.style.cursor = 'pointer';
			} else if (activeUnit) {
				document.body.style.cursor = raycaster.intersectObject(planet).length > 0 ? 'crosshair' : 'default';
			} else {
				document.body.style.cursor = 'default';
			}
		}

		function onPointerDown(event) {
			if (event.button === 0) {
				pointerDownPos.set(event.clientX, event.clientY);
				wasClick = true;
			}
		}

		function onPointerUp(event) {
			if (wasClick && event.button === 0) {
				handleClick();
			}
			wasClick = false;
		}

		function handleClick() {
			raycaster.setFromCamera(mouse, camera);

			if (selectedUnit) {
				const intersects = raycaster.intersectObject(planet);
				if (intersects.length > 0) {
					const hit = intersects[0];
					const worldNormal = hit.face.normal.clone().transformDirection(planet.matrixWorld);
					placeUnit(hit.point, worldNormal);
				}
				return;
			}

			const unitMeshes = [];
			for (const unit of placedUnits) {
				unit.traverse(child => { if (child.isMesh) unitMeshes.push(child); });
			}
			const unitHits = raycaster.intersectObjects(unitMeshes, false);
			if (unitHits.length > 0) {
				let obj = unitHits[0].object;
				while (obj.parent && !obj.userData.unitType) obj = obj.parent;
				if (obj.userData.unitType) {
					if (activeUnit === obj) {
						deselectPlacedUnit();
					} else {
						selectPlacedUnit(obj);
					}
					updateHint();
					return;
				}
			}

			if (activeUnit) {
				const intersects = raycaster.intersectObject(planet);
				if (intersects.length > 0) {
					commandMoveTo(intersects[0].point);
					return;
				}
			}

			deselectPlacedUnit();
			updateHint();
		}

		function onKeyDown(event) {
			if (event.key === 'Escape') {
				if (activeUnit) {
					deselectPlacedUnit();
				} else if (selectedUnit) {
					selectedUnit = null;
					removeGhost();
					document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('selected'));
				}
				updateHint();
			}
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		}

		function findClosestTarget(tank) {
			const info = unitTypes[tank.userData.unitType];
			const range = info.fireRange || TANK_FIRE_RANGE;
			let closest = null;
			let closestDist = Infinity;
			for (const unit of placedUnits) {
				if (unit === tank) continue;
				if (unitTypes[unit.userData.unitType].speed === 0) continue;
				const dist = tank.position.distanceTo(unit.position);
				if (dist < range && dist < closestDist) {
					closest = unit;
					closestDist = dist;
				}
			}
			return closest;
		}

		function aimTurretAt(tank, target) {
			const info = unitTypes[tank.userData.unitType];
			const s = info.tankScale || 1.0;
			const barrel = tank.children.find(c => c.userData && c.userData.isBarrel);
			if (!barrel) return;

			const toTarget = target.position.clone().sub(tank.position);
			const up = tank.position.clone().normalize();
			toTarget.sub(up.clone().multiplyScalar(toTarget.dot(up)));
			if (toTarget.lengthSq() < 0.0001) return;
			toTarget.normalize();

			const localFwd = info.localForward.clone();
			const worldFwd = localFwd.applyQuaternion(tank.quaternion);
			const projFwd = worldFwd.clone().sub(up.clone().multiplyScalar(worldFwd.dot(up)));
			if (projFwd.lengthSq() < 0.0001) return;
			projFwd.normalize();

			const angle = Math.atan2(
				new THREE.Vector3().crossVectors(projFwd, toTarget).dot(up),
				projFwd.dot(toTarget)
			);

			const turretBase = tank.children.find(c => c.userData && c.userData.isTurretBase);

			const qLocal = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle);
			if (turretBase) {
				turretBase.quaternion.slerp(qLocal, 0.1);
			}

			barrel.position.set(
				0.15 * s * Math.cos(angle),
				0.2 * s,
				0.15 * s * Math.sin(angle)
			);
			barrel.rotation.set(0, 0, 0);
			const barrelQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2);
			const rotQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle);
			barrel.quaternion.copy(rotQ.multiply(barrelQ));
		}

		function fireBullet(tank, target) {
			const info = unitTypes[tank.userData.unitType];
			const s = info.tankScale || 1.0;
			const damage = info.bulletDamage || BULLET_DAMAGE;

			const up = tank.position.clone().normalize();
			const toTarget = target.position.clone().sub(tank.position);
			toTarget.sub(up.clone().multiplyScalar(toTarget.dot(up)));
			if (toTarget.lengthSq() < 0.0001) return;
			toTarget.normalize();

			const muzzlePos = tank.position.clone()
				.add(toTarget.clone().multiplyScalar(0.3 * s))
				.add(up.clone().multiplyScalar(0.22 * s));

			playFireSound();

			const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial.clone());
			bullet.scale.setScalar(Math.max(0.8, s));
			bullet.position.copy(muzzlePos);
			scene.add(bullet);

			const startDir = muzzlePos.clone().normalize();
			const targetDir = target.position.clone().normalize();
			const arcAngle = Math.acos(Math.max(-1, Math.min(1, startDir.dot(targetDir))));

			bullet.userData = {
				startDir,
				targetDir,
				arcAngle,
				progress: 0,
				age: 0,
				target,
				damage,
				startHeight: muzzlePos.length(),
				targetHeight: target.position.length() + 0.22,
			};
			bullets.push(bullet);

			createMuzzleFlash(muzzlePos, up);
		}

		function createMuzzleFlash(pos, normal) {
			const flash = new THREE.PointLight(0xffaa33, 3, 1.5);
			flash.position.copy(pos);
			scene.add(flash);
			flash.userData.age = 0;
			flash.userData.maxAge = 0.1;
			explosions.push(flash);

			const flashGeo = new THREE.SphereGeometry(0.04, 4, 4);
			const flashMat = new THREE.MeshBasicMaterial({
				color: 0xffdd44, transparent: true, opacity: 1,
			});
			const flashMesh = new THREE.Mesh(flashGeo, flashMat);
			flashMesh.position.copy(pos);
			scene.add(flashMesh);
			flashMesh.userData.age = 0;
			flashMesh.userData.maxAge = 0.08;
			explosions.push(flashMesh);
		}

		function createExplosion(pos) {
			const light = new THREE.PointLight(0xff6600, 4, 2);
			light.position.copy(pos);
			scene.add(light);
			light.userData.age = 0;
			light.userData.maxAge = 0.25;
			explosions.push(light);

			for (let i = 0; i < 6; i++) {
				const sparkGeo = new THREE.SphereGeometry(0.015 + Math.random() * 0.02, 4, 4);
				const sparkMat = new THREE.MeshBasicMaterial({
					color: Math.random() > 0.5 ? 0xffaa22 : 0xff4400,
					transparent: true, opacity: 1,
				});
				const spark = new THREE.Mesh(sparkGeo, sparkMat);
				spark.position.copy(pos);
				const dir = new THREE.Vector3(
					Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
				).normalize().multiplyScalar(0.5 + Math.random() * 1.0);
				spark.userData.velocity = dir;
				spark.userData.age = 0;
				spark.userData.maxAge = 0.2 + Math.random() * 0.15;
				scene.add(spark);
				explosions.push(spark);
			}
		}

		function updateTankFiring(delta) {
			for (const unit of placedUnits) {
				const info = unitTypes[unit.userData.unitType];
				if (!info || !info.isTank) continue;

				if (unit.userData.fireCooldown === undefined) unit.userData.fireCooldown = 0;
				unit.userData.fireCooldown = Math.max(0, unit.userData.fireCooldown - delta);

				const target = findClosestTarget(unit);
				if (!target) continue;

				aimTurretAt(unit, target);

				if (unit.userData.fireCooldown <= 0) {
					fireBullet(unit, target);
					unit.userData.fireCooldown = info.fireCooldown || TANK_FIRE_COOLDOWN;
				}
			}
		}

		function updateBullets(delta) {
			for (let i = bullets.length - 1; i >= 0; i--) {
				const b = bullets[i];
				const ud = b.userData;
				ud.age += delta;

				if (ud.age > BULLET_LIFETIME) {
					scene.remove(b);
					bullets.splice(i, 1);
					continue;
				}

				const arcLength = ud.arcAngle * planetRadius;
				if (arcLength < 0.001) {
					createExplosion(b.position.clone());
					scene.remove(b);
					bullets.splice(i, 1);
					continue;
				}

				ud.progress = Math.min(1, ud.progress + (BULLET_SPEED * delta) / arcLength);
				const t = ud.progress;
				const angle = ud.arcAngle;
				const sinAngle = Math.sin(angle);

				let newDir;
				if (sinAngle < 0.001) {
					newDir = ud.targetDir.clone();
				} else {
					newDir = ud.startDir.clone()
						.multiplyScalar(Math.sin((1 - t) * angle) / sinAngle)
						.add(ud.targetDir.clone().multiplyScalar(Math.sin(t * angle) / sinAngle));
				}
				newDir.normalize();

				const arcHeight = Math.sin(t * Math.PI) * 0.15;
				const baseR = ud.startHeight + (ud.targetHeight - ud.startHeight) * t;
				const r = baseR + arcHeight;
				b.position.copy(newDir.clone().multiplyScalar(r));

				const hitDist = 0.35;
				if (ud.target && b.position.distanceTo(ud.target.position) < hitDist) {
					createExplosion(b.position.clone());
					damageUnit(ud.target, ud.damage || BULLET_DAMAGE);
					scene.remove(b);
					bullets.splice(i, 1);
					continue;
				}

				if (ud.progress >= 1) {
					createExplosion(b.position.clone());
					scene.remove(b);
					bullets.splice(i, 1);
				}
			}
		}

		function updateExplosions(delta) {
			for (let i = explosions.length - 1; i >= 0; i--) {
				const e = explosions[i];
				e.userData.age += delta;
				const t = e.userData.age / e.userData.maxAge;

				if (t >= 1) {
					scene.remove(e);
					explosions.splice(i, 1);
					continue;
				}

				if (e.isPointLight) {
					e.intensity *= 0.85;
				} else if (e.isMesh) {
					e.material.opacity = 1 - t;
					if (e.userData.velocity) {
						e.position.add(e.userData.velocity.clone().multiplyScalar(delta));
						e.userData.velocity.multiplyScalar(0.92);
					}
					e.scale.setScalar(1 + t * 0.5);
				}
			}
		}

		function spawnFactorySmoke(factory, offsetKey, dark) {
			const offset = factory.userData[offsetKey];
			if (!offset) return;
			const worldOffset = offset.clone().applyQuaternion(factory.quaternion);
			const pos = factory.position.clone().add(worldOffset);
			const up = factory.position.clone().normalize();

			const size = 0.05 + Math.random() * 0.06;
			const geo = new THREE.SphereGeometry(size, 6, 6);
			const tone = dark ? 0.35 + Math.random() * 0.15 : 0.7 + Math.random() * 0.2;
			const mat = new THREE.MeshBasicMaterial({
				color: new THREE.Color(tone, tone, tone * 1.02),
				transparent: true,
				opacity: 0.55,
				depthWrite: false,
				toneMapped: false,
			});
			const puff = new THREE.Mesh(geo, mat);
			puff.position.copy(pos);
			puff.renderOrder = 6;

			const drift = new THREE.Vector3(
				(Math.random() - 0.5) * 0.15,
				(Math.random() - 0.5) * 0.15,
				(Math.random() - 0.5) * 0.15
			);
			puff.userData.velocity = up.clone().multiplyScalar(0.25 + Math.random() * 0.2).add(drift);
			puff.userData.age = 0;
			puff.userData.maxAge = 1.6 + Math.random() * 1.2;
			puff.userData.growth = 1.4 + Math.random() * 0.8;

			scene.add(puff);
			smokeParticles.push(puff);
		}

		function updateSmoke(delta) {
			for (let i = smokeParticles.length - 1; i >= 0; i--) {
				const p = smokeParticles[i];
				p.userData.age += delta;
				const t = p.userData.age / p.userData.maxAge;
				if (t >= 1) {
					scene.remove(p);
					smokeParticles.splice(i, 1);
					continue;
				}
				p.position.add(p.userData.velocity.clone().multiplyScalar(delta));
				p.userData.velocity.multiplyScalar(0.96);
				p.material.opacity = 0.55 * (1 - t);
				p.scale.setScalar(1 + t * p.userData.growth);
			}
		}

		function findTankSpawnPosition(factory) {
			const up = factory.position.clone().normalize();
			const offset = factory.userData.spawnOffset || new THREE.Vector3(0.55, 0, 0);
			const worldOffsetDir = offset.clone().applyQuaternion(factory.quaternion).normalize();

			let tangent = worldOffsetDir.clone().sub(up.clone().multiplyScalar(worldOffsetDir.dot(up)));
			if (tangent.lengthSq() < 0.0001) {
				tangent = new THREE.Vector3(1, 0, 0).cross(up);
				if (tangent.lengthSq() < 0.0001) tangent = new THREE.Vector3(0, 0, 1).cross(up);
			}
			tangent.normalize();

			const factoryRadius = TANK_FACTORY_RADIUS;
			const startArc = (factoryRadius + UNIT_RADIUS + 0.05) / planetRadius;
			const stepArc = 0.04;
			const sideOffsets = [0, 0.35, -0.35, 0.7, -0.7, 1.0, -1.0, 1.4, -1.4, Math.PI];

			for (let step = 0; step < 8; step++) {
				const arc = startArc + step * stepArc;
				for (const sideRad of sideOffsets) {
					const sideQ = new THREE.Quaternion().setFromAxisAngle(up, sideRad);
					const dir = tangent.clone().applyQuaternion(sideQ);
					const axis = new THREE.Vector3().crossVectors(up, dir);
					if (axis.lengthSq() < 0.0001) continue;
					axis.normalize();
					const moveQ = new THREE.Quaternion().setFromAxisAngle(axis, arc);
					const newDir = up.clone().applyQuaternion(moveQ).normalize();
					const newPos = newDir.clone().multiplyScalar(getTerrainRadius(newDir));
					if (!wouldOverlap(newPos, null, UNIT_RADIUS)) {
						return { position: newPos, normal: newDir, facing: dir };
					}
				}
			}
			return null;
		}

		function produceTankFromFactory(factory, tankType) {
			const spawn = findTankSpawnPosition(factory);
			if (!spawn) return false;

			const tank = createUnitMesh(tankType);
			orientToSurface(tank, spawn.position, spawn.normal, spawn.facing);
			scene.add(tank);
			placedUnits.push(tank);

			const maxHealth = unitTypes[tankType].maxHealth || UNIT_MAX_HEALTH;
			tank.userData.health = maxHealth;
			tank.userData.maxHealth = maxHealth;
			createHealthBar(tank);

			document.getElementById('unit-count').textContent = `Units: ${placedUnits.length}`;

			for (let i = 0; i < 6; i++) spawnFactorySmoke(factory, 'chimneyOffset', false);
			return true;
		}

		function enqueueFactoryBuild(factory, tankType) {
			if (!unitTypes[tankType] || !unitTypes[tankType].isTank) return;
			if (!factory.userData.buildQueue) factory.userData.buildQueue = [];
			factory.userData.buildQueue.push(tankType);
			rebuildFactoryQueueUI();
		}

		function cancelFactoryBuild(factory, queueIndex) {
			const q = factory.userData.buildQueue;
			if (!q || queueIndex >= q.length) return;
			q.splice(queueIndex, 1);
			if (queueIndex === 0) factory.userData.buildProgress = 0;
			rebuildFactoryQueueUI();
		}

		function updateFactories(delta) {
			for (const factory of placedUnits) {
				if (factory.userData.unitType !== 'tankFactory') continue;

				const ud = factory.userData;
				if (!ud.buildQueue) ud.buildQueue = [];
				if (ud.buildProgress === undefined) ud.buildProgress = 0;

				const idleSmokeRate = ud.buildQueue.length > 0 ? 12 : 3;
				if (Math.random() < delta * idleSmokeRate) spawnFactorySmoke(factory, 'chimneyOffset', false);
				if (Math.random() < delta * (idleSmokeRate * 0.4)) spawnFactorySmoke(factory, 'chimneyOffset2', true);

				if (ud.antennaTip) {
					const speedMul = ud.buildQueue.length > 0 ? 0.012 : 0.004;
					const blink = 0.5 + Math.abs(Math.sin(performance.now() * speedMul)) * 1.4;
					ud.antennaTip.material.emissiveIntensity = blink;
				}

				if (ud.buildQueue.length > 0) {
					const currentType = ud.buildQueue[0];
					const buildTime = unitTypes[currentType].buildTime || 5.0;
					const prevLen = ud.buildQueue.length;
					ud.buildProgress += delta;

					if (ud.buildProgress >= buildTime) {
						if (produceTankFromFactory(factory, currentType)) {
							ud.buildQueue.shift();
							ud.buildProgress = 0;
						} else {
							ud.buildProgress = buildTime - 0.5;
						}
					}

					if (activeUnit === factory) {
						if (ud.buildQueue.length !== prevLen) {
							rebuildFactoryQueueUI();
						} else {
							updateFactoryProgressUI(factory);
						}
					}
				}
			}
		}

		function createHealthBar(unit) {
			const barGroup = new THREE.Group();

			const bgGeo = new THREE.PlaneGeometry(0.5, 0.07);
			const bgMat = new THREE.MeshBasicMaterial({ color: 0x222222, depthTest: false, transparent: true, opacity: 0.2, toneMapped: false });
			const bgMesh = new THREE.Mesh(bgGeo, bgMat);
			bgMesh.renderOrder = 1;
			barGroup.add(bgMesh);

			const fgGeo = new THREE.PlaneGeometry(0.5, 0.07);
			const fgMat = new THREE.MeshBasicMaterial({ color: 0x44ff44, depthTest: false, toneMapped: false });
			const fgMesh = new THREE.Mesh(fgGeo, fgMat);
			fgMesh.renderOrder = 2;
			fgMesh.position.z = 0.001;
			barGroup.add(fgMesh);

			barGroup.userData.fgMesh = fgMesh;
			scene.add(barGroup);
			unit.userData.healthBar = barGroup;

			updateHealthBarVisual(unit);
		}

		function updateHealthBarVisual(unit) {
			console.log('updateHealthBarVisual', unit);
			const bar = unit.userData.healthBar;
			if (!bar) return;
			const pct = unit.userData.health / unit.userData.maxHealth;
			const fg = bar.userData.fgMesh;
			fg.scale.x = Math.max(0.001, pct);
			fg.position.x = (pct - 1) * 0.25;
			console.log('health pct', pct);
			if (pct > 0.5) {
				fg.material.color.setHex(0x44ff44);
			} else if (pct > 0.25) {
				fg.material.color.setHex(0xffdd00);
			} else {
				fg.material.color.setHex(0xff2222);
			}
		}

		function updateHealthBars() {
			for (const unit of placedUnits) {
				const bar = unit.userData.healthBar;
				if (!bar) continue;
				const up = unit.position.clone().normalize();
				bar.position.copy(unit.position).addScaledVector(up, 0.45);
				bar.quaternion.copy(camera.quaternion);
			}
		}

		function damageUnit(unit, amount) {
			console.log('damageUnit', unit, amount);
			if (!unit.userData || unit.userData.health === undefined) return;
			unit.userData.health = Math.max(0, unit.userData.health - amount);
			updateHealthBarVisual(unit);
			if (unit.userData.health <= 0) {
				destroyUnit(unit);
			}
		}

		function destroyUnit(unit) {
			createExplosion(unit.position.clone());
			if (unit.userData.healthBar) {
				scene.remove(unit.userData.healthBar);
			}
			for (const b of bullets) {
				if (b.userData.target === unit) b.userData.target = null;
			}
			if (activeUnit === unit) {
				deselectPlacedUnit();
			}
			scene.remove(unit);
			const idx = placedUnits.indexOf(unit);
			if (idx !== -1) placedUnits.splice(idx, 1);
			document.getElementById('unit-count').textContent = `Units: ${placedUnits.length}`;
		}

		function render() {
			const delta = clock.getDelta();
			controls.update();
			updateMovingUnits(delta);
			updateTankFiring(delta);
			updateBullets(delta);
			updateExplosions(delta);
			updateSmoke(delta);
			updateFactories(delta);
			updateClouds(delta);
			updateHealthBars();
			renderer.render(scene, camera);
		}
	</script>
</body>

</html>
